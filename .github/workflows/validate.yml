name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Manifests, frontmatter, leak guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 .github/scripts/validate.py
